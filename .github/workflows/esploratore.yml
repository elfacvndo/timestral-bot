# Esploratore sempre acceso: prova più strategie con operazioni piccole e impara dai risultati (vedi esploratore.py).
# Un giro dura ~5 ore e mezza (GitHub ferma un lavoro dopo 6), poi si rilancia da solo; le operazioni aperte le
# riprende il giro dopo (logs/esploratore_aperte.json). Il cron ogni ora è la riserva se il rilancio si perde.
# Spegnere: GitHub → Actions → "Esploratore" → "..." → Disable workflow.
name: Esploratore
on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
concurrency: esploratore
permissions:
  contents: write   # salva il registro nel repository
  actions: write    # si rilancia da solo
  issues: write     # avvisi (kill switch, posizioni senza registro)
jobs:
  esploratore:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run esploratore.py --prova
      - run: |
          git config user.name "timestral-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run esploratore.py
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
      - name: Salva il registro
        if: always()
        run: |
          git add logs 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "registro esploratore $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done; exit 1
      - name: Rilancia
        if: ${{ !cancelled() }}   # anche dopo un errore: le operazioni aperte le riprende solo il giro dopo
        run: gh workflow run esploratore.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
