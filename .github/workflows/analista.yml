# Analista AI sempre acceso: un modello linguistico decide ogni 15 minuti su 15 mercati (crypto sempre, fondi a Borsa aperta),
# una sola domanda per tutti; il bot misura il rischio (vedi analista.py). Dal 2026-11-16 è l'unico bot acceso.
# Un giro dura ~5 ore e mezza (GitHub ferma un lavoro dopo 6), poi si rilancia da solo; le operazioni aperte le
# riprende il giro dopo (logs/analista_aperta.json). Il cron ogni ora è la riserva se il rilancio si perde.
# Spegnere: GitHub → Actions → "Analista AI" → "..." → Disable workflow.
name: Analista AI
on:
  workflow_dispatch:
  schedule:
    - cron: "52 * * * *"
concurrency: analista
permissions:
  contents: write   # salva il registro nel repository
  actions: write    # si rilancia da solo
jobs:
  analista:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: npm install -g @anthropic-ai/claude-code   # Claude Code: il modello con l'abbonamento Claude
      - run: uv run analista.py --prova
      - run: |
          git config user.name "analista-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run analista.py
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # dall'abbonamento: claude setup-token
          MODELLO: opus                  # opus | sonnet: cambiare modello = cambiare questa riga
          LIVELLO: pieno                 # suggerisce | apre_chiude | pieno
          PYTHONUNBUFFERED: "1"
      - name: Salva il registro
        if: always()
        run: |
          git add logs 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "registro analista $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done; exit 1
      - name: Rilancia
        if: ${{ !cancelled() }}   # anche dopo un errore: le operazioni aperte le riprende solo il giro dopo
        run: gh workflow run analista.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
