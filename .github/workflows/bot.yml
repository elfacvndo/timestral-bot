# Bot Timestral sempre acceso: un giro dura ~5 ore e mezza (GitHub ferma un lavoro dopo 6), poi si rilancia da solo.
# Solo SPY (aspetta la Borsa USA aperta, 15:30-22:00 italiane). ETH spento il 2026-11-13: con 0,55% di costi contro
# ~0,3% di movimento perde per costruzione. Per riaccenderlo: rimettere ETH nella lista "mercato" qui sotto.
# Il cron ogni ora è la riserva se il rilancio si perde. Mai due giri insieme (concurrency).
# Spegnere: GitHub → Actions → "Bot Timestral" → "..." → Disable workflow. Il bot vende quello che ha prima di uscire.
name: Bot Timestral
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
concurrency: timestral
permissions:
  contents: write   # salva il registro delle operazioni nel repository
  actions: write    # si rilancia da solo
  issues: write     # avvisi (kill switch, posizioni rimaste da un giro interrotto)
jobs:
  bot:
    strategy:
      fail-fast: false   # se un mercato si rompe, l'altro continua
      matrix:
        mercato: [SPY]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run bot.py --prova
      - run: |
          git config user.name "timestral-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run bot.py
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
          MERCATO: ${{ matrix.mercato }}
      - name: Salva il registro
        if: always()
        run: |
          git add logs 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "registro ${{ matrix.mercato }} $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done; exit 1  # l'altro mercato può spingere insieme
      - name: Rilancia
        # anche dopo un errore: un giro morto non deve spegnere il bot. Solo un annullamento a mano lo ferma.
        if: ${{ !cancelled() && matrix.mercato == 'SPY' }}
        run: gh workflow run bot.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
